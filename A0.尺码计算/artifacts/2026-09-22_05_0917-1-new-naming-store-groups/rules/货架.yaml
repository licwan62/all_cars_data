# 店铺尺码先按本文件限定候选池，再使用尺码匹配规则计算。
# 尺码直接使用 data/0917.1-新命名.csv 的“尺码”字段。
规则:
  文件: ../us/0917.1-新命名.csv
  尺码字段: 尺码

