input:
  path: ../03.尺码计算/output/全尺码全量.csv
  encoding: utf-8-sig

columns:
  make: MAKE
  model: MODEL
  sales: 销量合计

code:
  width: 2
  max_value: 99

mapping:
  make_path: data/mapping/make_mapping.csv
  model_path: data/mapping/model_mapping.csv

artifacts:
  path: artifacts
  slug: code-mapping-publish

publish:
  path: output/vehicle_mapping.csv

public_publish:
  path: ../public/car_code/vehicle_mapping.csv

backup:
  enabled: true
  path: data/mapping/backups

normalization:
  trim_whitespace: true
  case_insensitive_key: true
