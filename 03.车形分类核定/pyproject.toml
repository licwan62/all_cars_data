[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vehicle-cover-shape-research"
version = "0.2.0"
description = "Read-only, evidence-gated vehicle cover shape research"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0", "openpyxl>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=8"]
automatic = ["numpy>=2", "opencv-python-headless>=4.10", "Pillow>=10", "onnxruntime>=1.20"]

[project.scripts]
cover-shape = "cover_shape.cli:main"

[tool.setuptools.packages.find]
where = ["code"]
include = ["cover_shape*"]
