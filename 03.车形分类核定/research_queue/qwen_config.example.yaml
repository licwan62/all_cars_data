# 千问车型族研究配置样例。复制为同目录 qwen_config.yaml（已 gitignore）后修改；
# 也可用 --config 指定其他路径。密钥优先从 api_key_env 指定的环境变量读取。

# dashscope：百炼原生接口，支持联网搜索并返回来源列表（推荐，来源 URL 只取检索结果）。
# openai：任意 OpenAI 兼容接口（如百炼 compatible-mode、自建网关）；不一定返回检索来源，见 allow_unverified_urls。
api_style: dashscope

# dashscope 填服务根地址：国内站 https://dashscope.aliyuncs.com ，国际站 https://dashscope-intl.aliyuncs.com
# openai 填含 /v1 的地址，如 https://dashscope.aliyuncs.com/compatible-mode/v1
base_url: https://dashscope.aliyuncs.com

model: qwen-plus
# 百炼原生接口路径：auto 先试文本生成，遇 url error 自动改走多模态（qwen3.x 等新模型只支持多模态路径）；也可固定 text / multimodal。
dashscope_endpoint: auto
# 推理模型（如 qwen3.x）是否深度思考。开启后单个车型族可达 5 分钟、易超时；默认关闭，关闭后约 5 秒/族。
enable_thinking: false

# 从环境变量读取密钥（推荐）：PowerShell 执行 setx DASHSCOPE_API_KEY "sk-..." 后重新打开终端。
api_key_env: DASHSCOPE_API_KEY
# 也可直接写密钥，但只能写在 gitignore 的 qwen_config.yaml 里，切勿写进本样例或提交。
# api_key: sk-...

# 检索来源：dashscope = 百炼内置联网搜索（偏中文网页）；tavily = 先用 Tavily 英文网页搜索，
# 结果编号后交给千问判断（推荐，美规车型资料更对口）。
search_provider: tavily
tavily:
  api_key_env: TAVILY_API_KEY
  # api_key: tvly-...        # 只能写在 gitignore 的 qwen_config.yaml 里
  search_depth: basic        # basic（1 credit）/ advanced（2 credits，结果更全）
  max_results: 5             # 每次搜索返回条数
  queries_per_family: 3      # 每族最多检索次数：1 条整族 + 按代际抽样年补充
  snippet_chars: 500         # 每条结果附给模型的摘要长度
  include_domains: []        # 可限定来源站点，如 [en.wikipedia.org, media.ford.com]
  exclude_domains: []

# 联网搜索（dashscope 模式）。forced_search 保证每个车型族都检索；search_strategy 可选 turbo / max。
enable_search: true
forced_search: true
search_strategy: turbo

# openai 模式下透传到请求体的额外参数（例如兼容接口的 enable_search）。
extra_body: {}
# openai 模式没有返回检索来源时，是否接受模型自己给出的 URL（会在 note 中标注“未经检索核对”）。默认不接受。
allow_unverified_urls: false

temperature: 0.2
timeout_seconds: 180
max_retries: 4          # 429 / 5xx / 网络错误的重试次数（指数退避）
concurrency: 6          # 并发研究的车型族数（每路一个 qwen-family-N worker 名）
max_fix_attempts: 2     # 校验不过时把错误反馈给模型修正的次数
market: US
