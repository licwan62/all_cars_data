enabled: true
rule_version: geometric-auto-v1-experimental
experimental: true
# 没有人工图像输入；动态检索当前车型年款，禁止按车型名称预填标签。
search_rounds: 3
search_results: 12
max_images_per_variant: 12
max_accepted_profiles: 2
allowed_licenses:
  - CC BY 2.0
  - CC BY 3.0
  - CC BY 4.0
  - CC BY-SA 2.0
  - CC BY-SA 2.5
  - CC BY-SA 3.0
  - CC BY-SA 4.0
  - CC0
  - Public domain
excluded_metadata_words:
  - interior
  - engine
  - dashboard
  - modelcar
  - miniature
  - toy
  - rendering
  - ai-generated
  - drawing
  - illustration
  - render
  - modified
  - custom
  - tuned
  - lowered
  - replica
body_identity_aliases:
  coupe: [coupe, coupé, notchback, hardtop]
  hatchback: [hatchback, fastback, liftback]
  liftback: [liftback, fastback, gran turismo]
  wagon: [wagon, estate]
  crossover: [crossover, suv]
  suv: [suv, crossover]
  sedan: [sedan, saloon, notchback]
trim_identity_aliases:
  gt: [gran turismo]
special_trim_terms: [type r, performance, prime, plaid, gr yaris]
segmentation_model:
  name: u2netp
  url: https://github.com/danielgatis/rembg/releases/download/v0.0.0/u2netp.onnx
  sha256: 309c8469258dda742793dce0ebea8e6dd393174f89934733ecc8b14c76f4ddd8
  purpose: background segmentation only; no vehicle class prediction
  upstream_license: Apache-2.0 U-2-Net; rembg implementation MIT
  redirect_domains: [github.com, release-assets.githubusercontent.com, objects.githubusercontent.com]
geometry:
  mask_threshold: 0.55
  min_side_aspect_ratio: 1.8
  min_mask_fill: 0.48
  wheel_hough_threshold: 22
  wheel_dark_max: 95
  wheel_dark_fraction: 0.55
  min_wheel_ellipse_ratio: 0.82
  min_wheelbase_image_ratio: 0.45
  max_wheelbase_image_ratio: 0.82
  max_wheel_radius_delta: 0.12
  max_wheel_level_delta: 0.025
  roof_band_height: 0.9
  deck_height: 0.7
  flat_slope_max: 0.4
# 以下是可解释的试验边界，候选状态最高 INFERRED，不能宣称已经人工标定/VERIFIED。
classification:
  low_height_mm: 1350
  low_height_length_ratio: 0.31
  tall_height_length_ratio: 0.36
  compact_height_length_ratio: 0.34
  compact_length_mm: 4300
  crossover_height_mm: 1550
  box_roof_end_x: 0.78
  box_roof_plateau: 0.35
  notchback_deck_ratio: 0.14
  sloped_rear_run: 0.16
  sloped_roof_end_x: 0.76
