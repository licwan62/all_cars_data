version: 1

# 默认直接执行；排查配置时可在命令行用 -Mode dry_run 或 -Mode check 覆盖。
mode: work

workspace:
  # 当前 config.yaml 所在目录就是项目根目录。
  # 整个任务目录复制或改名后，无需修改日期、品牌或目录名。
  root: .
  traversal:
    strategy: explicit
    projects:
      - .

project_layout:
  input: input
  output: output
  reply: replies
  tables: tables
  log: log.csv
  summary: summary.txt

runtime:
  max_rounds: 150
  max_reply_wait_seconds: 9999
  browser: playwright
  conversation:
    mode: new
    archive_code: ""
    archive_path: conversation_archives.json

  # 只扫描当前项目的 input 目录，避免把根目录里的 log.csv 等运行产物误当输入。
  # 后续任务只需替换 input 下的 TSV，无需修改这里的文件名。
  # 使用新的输入名开启独立优化续跑，保留原 list.tsv 与旧 checkpoint 供追溯。
  input_sources:
    files:
      - path: input/list_optimized.tsv
    order: name_asc

  # 中间轮只回传变更 TSV；最终 COMPLETE 时仍须给完整可替换 TSV。
  followup_output: delta

  processing:
    # 一个输入文件使用一个独立对话，便于同一车型的不同结构和年份互相校验。
    mode: file
    checkpoint_dir: checkpoints

  continue_on_error: false
  only_files: []
  input_files:
    skip_processed: true

data_contract:
  # 相对 config.yaml：当前任务目录 -> artifacts -> 自动化尺寸抓取器。
  requirement: requirement_optimized.md
  dimension_representative:
    enabled: true
    # 仅完整组合一致时才允许共享代表尺寸；结构不同会在研究结果中拆成独立行。
    key_columns:
      - MAKE
      - MODEL
      - 代际
      - 结构
      - 版本
      - CAB
      - BED
    year_column: YEAR
    dimension_columns:
      - L-IN
      - W-IN
      - H-IN
    minimum_comparison_years: 2
    outlier:
      comparison_rule: absolute_or_relative
      max_absolute_difference:
        L-IN: 4.0
        W-IN: 2.0
        H-IN: 2.0
      max_relative_difference_percent: 3.0
    representative_year:
      strategy: best_documented
    audit_columns:
      - 参考车型
      - 备注
