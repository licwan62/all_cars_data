version: shape-research-queue-v2-us-representatives
batch_limit: 8
max_requests: 120
max_attempts: 3
retry_after_hours: 48
market_priority: [US, EU, RU]
research_markets: [US]
representative_fields: [make, model, generation, body_type, trim, market, CAB, BED]
max_per_model_per_batch: 1
# 只选择研究对象；不预填分类，也不向未研究的其他尺寸/年份分支广播证据。
# 同代际编号在上游可能覆盖多个年代，指定源分支可精确选择当前代表。
representative_selectors:
  - {representative_source_id: 'Acura Integra Hatchback 2023-2026 US'}
  - {representative_source_id: 'Honda Accord Sedan 2023-2026 US'}
  - {representative_source_id: 'Toyota C-HR Crossover 2020-2022 US'}
  - {representative_source_id: 'Toyota Land Cruiser SUV 2024-2026 US'}
  - {representative_source_id: 'Toyota Venza SUV 2021-2024 US'}
  - {representative_source_id: 'Nissan Z Coupe 2023-2026 US'}
  - {representative_source_id: 'Toyota Corolla Hatchback 2025-2026 US'}
  - {representative_source_id: 'Honda HR-V SUV 2023-2026 US'}
# 起步队列优先补充已知仍只有原型推断的边界车型；不预填分类结果。
kickoff_selectors:
  - {make: Tesla, model: Model Y, generation: gen1, market: US}
  - {make: Kia, model: Soul, generation: gen3, market: US}
  - {make: Ford, model: Mustang, generation: gen1, market: US}
  - {make: Ford, model: Mustang, generation: gen3, market: US}
priority_order: [conflict, kickoff, ambiguous_low_roof, ambiguous, prototype]
missing_dimensions_state: BLOCKED_INPUT
automatic_network: explicit_online_command_only
