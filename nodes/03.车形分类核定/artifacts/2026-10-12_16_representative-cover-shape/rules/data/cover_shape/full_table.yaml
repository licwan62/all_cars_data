version: representative-shape-v1
representative_year: evidence_year_then_lower_median
group_scope: [make, model, generation, body_type, trim, CAB, BED, market, length_mm, width_mm, height_mm, legacy_shape]
missing_generation: isolate_source_record
fallback: prototype_geometry_and_dimensions
missing_dimensions_shape: OTHER
# 这些是已有车形定义的几何先验，不是当前车辆的已验证测量；状态最高 INFERRED。
# 不使用 BODY_TYPE 或分类字段直接映射 SHAPE，不把 SHAPE 用于尺码/SKU。
prototype_geometry:
  H0: {low_cabin: true, sloped_rear: true}
  H1: {high_cabin: true, short_hood: true, box_body: true, upright_rear: true}
  H2: {extended_roof: true, low_cabin: true}
  H3: {extended_roof: true, upright_rear: true}
  JP: {high_cabin: true, box_body: true, upright_rear: true}
  P0: {separate_cab: true, open_cargo_bed: true}
  P1: {separate_cab: true, open_cargo_bed: true, flared_fenders: true}
  P2: {separate_cab: true, open_cargo_bed: true, flared_fenders: true}
  DUAL: {separate_cab: true, open_cargo_bed: true, wide_rear_axle: true}
  SD0: {low_cabin: true, tapered_upper_body: true, rear_geometry_unknown: true}
  SD1: {regular_cabin: true, tapered_front: true, rear_geometry_unknown: true}
  SD2: {regular_cabin: true, box_front: true, rear_geometry_unknown: true}
  SU0: {high_cabin: true, tapered_front: true, tapered_upper_body: true, rear_geometry_unknown: true}
  SU1: {high_cabin: true, full_cabin: true, rear_geometry_unknown: true}
  SU2: {high_cabin: true, box_body: true, rear_geometry_unknown: true}
  V0: {single_volume: true, high_cabin: true, short_hood: true}
  V1: {single_volume: true, high_cabin: true, box_body: true}
classification:
  low_height_mm: 1350
  low_height_length_ratio: 0.31
  compact_length_mm: 4300
  compact_height_length_ratio: 0.34
  compact_box_length_mm: 4400
  crossover_height_mm: 1550
  tall_height_length_ratio: 0.36
# 尾部无观测时仍给一个推断主候选，并保留另一种尾部形态作为备选。
default_regular_rear: notchback
