enabled: true
rule_version: geometric-auto-v2-experimental
experimental: true
# 没有人工图像输入；动态检索当前车型年款，禁止按车型名称预填标签。
search_rounds: 3
search_results: 12
max_images_per_variant: 12
max_accepted_profiles: 2
allowed_licenses:
  - CC BY 2.0
  - CC BY 3.0
  - CC BY 4.0
  - CC BY-SA 2.0
  - CC BY-SA 2.5
  - CC BY-SA 3.0
  - CC BY-SA 4.0
  - CC0
  - Public domain
excluded_metadata_words:
  - interior
  - engine
  - dashboard
  - modelcar
  - miniature
  - toy
  - rendering
  - ai-generated
  - drawing
  - illustration
  - render
  - modified
  - custom
  - tuned
  - lowered
  - replica
body_identity_aliases:
  coupe: [coupe, coupé, notchback, hardtop]
  hatchback: [hatchback, fastback, liftback]
  liftback: [liftback, fastback, gran turismo]
  wagon: [wagon, estate]
  crossover: [crossover, suv]
  suv: [suv, crossover]
  sedan: [sedan, saloon, notchback]
trim_identity_aliases:
  gt: [gran turismo]
special_trim_terms: [type r, performance, prime, plaid, gr yaris]
model_variant_terms: [cross, prime, plus, hybrid cross]
description_lexicon:
  roof_slope:
    - '(?:sloping|sloped|fastback|faster|coupe-style)\s+roofline'
    - 'roofline\s+sloping'
    - 'coupe-like\s+(?:silhouette|profile)'
    - 'one[- ]motion\s+silhouette|monoform'
  streamlined_profile:
    - 'silhouette.{0,45}aerodynamic'
  rear_step:
    - 'notchback'
    - '(?:distinct|separate)\s+(?:rear\s+)?(?:deck|trunk)'
  box_outline:
    - 'boxy\s+(?:silhouette|dimensions|profile|design)'
  upright_rear:
    - '(?:vertical|upright)\s+(?:rear\s+)?(?:window|tailgate)'
  compact_packaging:
    - 'compact\s+(?:footprint|dimensions|body|package|size)'
    - 'small\s+(?:on the outside|exterior|body|footprint)'
# 初始来源由本次自动研究发现；只登记来源/身份范围，不登记车型对应标签。
# 后续未命中此参考索引的车型仍动态执行 Commons 检索。
document_sources:
  - selector: {make: Ford, model: Mustang, generation: gen2, market: US, body_types: [Coupe, Hatchback]}
    url: https://mustangii.co.uk/1974-mustang-ii/
    publisher: Mustang II archive reproducing Ford 1974 press announcement
    source_rank: B
    source_model_year: 1974
    source_market: US
    title_pattern: '1974\s+Mustang\s+II'
    body_scoped_sentences: true
  - selector: {make: Honda, model: Civic, generation: gen11, market: US, body_types: [Hatchback]}
    url: https://hondanews.com/en-US/honda-automobiles/releases/release-20c92b0d934f0bc63982bd3eee0149e9-2022-honda-civic-hatchback-press-kit
    publisher: American Honda Motor Co.
    source_rank: A
    source_model_year: 2022
    source_market: US
    title_pattern: '2022\s+Honda\s+Civic\s+Hatchback'
    body_scoped_sentences: true
  - selector: {make: Toyota, model: Yaris, generation: gen3, market: US, body_types: [Hatchback]}
    url: https://pressroom.toyota.com/2020-toyota-yaris-hatchback/
    publisher: Toyota USA Newsroom
    source_rank: A
    source_model_year: 2020
    source_market: US
    title_pattern: '2020\s+Toyota\s+Yaris\s+Hatchback'
  - selector: {make: Toyota, model: Prius, generation: gen5, market: US, body_types: [Hatchback]}
    url: https://pressroom.toyota.com/stunning-style-and-elevated-efficiency-the-2024-toyota-prius/
    publisher: Toyota USA Newsroom
    source_rank: A
    source_model_year: 2024
    source_market: US
    title_pattern: '2024\s+Toyota\s+Prius'
  - selector: {make: Kia, model: Soul, generation: gen3, market: US, body_types: [Wagon]}
    url: https://www.kiamedia.com/us/en/media/pressreleases/14978/2020-soul-overview
    publisher: Kia America Newsroom
    source_rank: A
    source_model_year: 2020
    source_market: US
    title_pattern: '2020\s+Soul\s+Overview'
  - selector: {make: BMW, model: 3 Series, trim: GT, generation: gen6, market: US, body_types: [Liftback]}
    url: https://www.press.bmwgroup.com/usa/article/detail/T0136911EN_US/the-all-new-bmw-3-series-gran-turismo
    publisher: BMW Group USA
    source_rank: A
    source_model_year: 2014
    source_market: US
    title_pattern: 'BMW\s+3\s+Series\s+Gran\s+Turismo'
segmentation_model:
  name: u2netp
  url: https://github.com/danielgatis/rembg/releases/download/v0.0.0/u2netp.onnx
  sha256: 309c8469258dda742793dce0ebea8e6dd393174f89934733ecc8b14c76f4ddd8
  purpose: background segmentation only; no vehicle class prediction
  upstream_license: Apache-2.0 U-2-Net; rembg implementation MIT
  redirect_domains: [github.com, release-assets.githubusercontent.com, objects.githubusercontent.com]
geometry:
  mask_threshold: 0.55
  min_side_aspect_ratio: 1.8
  min_mask_fill: 0.48
  wheel_hough_threshold: 22
  wheel_dark_max: 95
  wheel_dark_fraction: 0.55
  min_wheel_ellipse_ratio: 0.82
  min_wheelbase_image_ratio: 0.45
  max_wheelbase_image_ratio: 0.82
  max_wheel_radius_delta: 0.12
  max_wheel_level_delta: 0.025
  roof_band_height: 0.9
  deck_height: 0.7
  flat_slope_max: 0.4
# 以下是可解释的试验边界，候选状态最高 INFERRED，不能宣称已经人工标定/VERIFIED。
classification:
  low_height_mm: 1350
  low_height_length_ratio: 0.31
  tall_height_length_ratio: 0.36
  compact_height_length_ratio: 0.34
  compact_length_mm: 4300
  crossover_height_mm: 1550
  box_roof_end_x: 0.78
  box_roof_plateau: 0.35
  notchback_deck_ratio: 0.14
  sloped_rear_run: 0.16
  sloped_roof_end_x: 0.76
