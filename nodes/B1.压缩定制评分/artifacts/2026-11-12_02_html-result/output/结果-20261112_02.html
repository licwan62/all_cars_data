<script>
"use strict";
const report=JSON.parse(document.getElementById('report-data').textContent), $=id=>document.getElementById(id);
const node=report.node, sets=report.datasets, cache=new Map(); let selected=-1, content=null, filtered=[], page=0, sequence=0;
const el=(tag,text,cls)=>{const e=document.createElement(tag);e.textContent=text;if(cls)e.className=cls;return e;};
document.title=node.path.split('/').pop()+' · 节点结果';$('title').textContent=node.path.split('/').pop();
$('description').textContent=node.path+' · '+node.id;
for(const text of [report.state,'数据版本 '+(report.manifest.version||'未发布'),'HTML '+report.html_version])$('tags').append(el('span',text,'tag'));
for(const [label,value] of [['登记结果',sets.length],['表格记录',sets.reduce((n,d)=>n+(d.rows||0),0).toLocaleString()],['待处理事项',(node.pending||[]).length],['子项目',report.children.length]]){const box=el('div','','metric');box.append(el('span',label,'muted'),el('strong',String(value)));$('metrics').append(box);}
for(const text of report.warnings)$('warnings').append(el('li',text));
const pending=[...(node.pending||[]),...(node.release_notes||[]),...(node.blockers||[])];
if(report.children.length)pending.push(...report.children.map(n=>n.path+' · '+n.lifecycle));
if(!pending.length)pending.push('未登记待处理事项；这不构成数据已核实声明。');
const list=el('ul','');for(const text of pending)list.append(el('li',text));$('pending').append(list);$('pendingBox').open=!!pending.length&&sets.length===0;
$('provenance').textContent=JSON.stringify({html_version:report.html_version,data_version:report.manifest.version||null,published_at:report.manifest.published_at||null,upstream:report.manifest.upstream||[],checks:report.manifest.checks||{},rules:report.rules},null,2);
for(const [i,d] of sets.entries()){const b=el('button',d.file,'file');b.append(el('small',!d.exists?'文件缺失':d.kind==='table'?d.rows.toLocaleString()+' 行 · '+d.columns.length+' 列':'文本结果'));b.onclick=()=>select(i);$('files').append(b);}
async function unpack(d){if(cache.has(d.file))return cache.get(d.file);if(typeof DecompressionStream==='undefined')throw Error('当前浏览器不支持离线解压，请使用新版 Edge 或 Chrome。');const bytes=Uint8Array.from(atob(d.packed),c=>c.charCodeAt(0));const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));const value=JSON.parse(await new Response(stream).text());cache.set(d.file,value);return value;}
async function select(i){const ticket=++sequence;selected=i;content=null;page=0;$('search').value='';$('download').disabled=true;$('searchCount').textContent='';$('previous').disabled=true;$('next').disabled=true;$('page').textContent='';const d=sets[i];$('download').textContent=d.kind==='table'?'导出 CSV':'导出文本';[...$('files').children].forEach((b,j)=>b.classList.toggle('active',j===i));$('fileTitle').textContent=d.file;$('source').textContent=d.exists?'SHA256 '+d.sha256+' · '+(d.matches_manifest?'与数据 manifest 一致':'未获数据 manifest 核实'): '登记的交付物尚不存在';$('viewer').className='empty';$('viewer').textContent='正在解压完整结果…';$('search').disabled=d.kind!=='table';try{if(!d.exists)throw Error('尚未产出此文件，未生成替代数据。');const value=await unpack(d);if(ticket!==sequence)return;content=value;$('download').disabled=false;filter();}catch(e){if(ticket===sequence)$('viewer').textContent=e.message;}}
function filter(){if(content===null)return;const d=sets[selected];if(d.kind!=='table'){$('viewer').className='text-content';$('viewer').replaceChildren(el('pre',content));$('page').textContent='文本结果';$('previous').disabled=true;$('next').disabled=true;return;}const q=$('search').value.toLocaleLowerCase().trim();filtered=q?content.filter(row=>row.some(cell=>String(cell).toLocaleLowerCase().includes(q))):content;page=0;render();}
function render(){const d=sets[selected],pages=Math.max(1,Math.ceil(filtered.length/50));page=Math.min(page,pages-1);const table=el('table',''),head=el('thead',''),tr=el('tr','');for(const col of d.columns)tr.append(el('th',col));head.append(tr);table.append(head);const body=el('tbody','');for(const row of filtered.slice(page*50,page*50+50)){const tr=el('tr','');for(let i=0;i<Math.max(row.length,d.columns.length);i++)tr.append(el('td',row[i]??''));body.append(tr);}table.append(body);$('viewer').className='table-wrap';$('viewer').replaceChildren(table);$('viewer').scrollTop=0;$('searchCount').textContent=filtered.length.toLocaleString()+' / '+content.length.toLocaleString()+' 行';$('page').textContent=(page+1)+' / '+pages+' 页';$('previous').disabled=page===0;$('next').disabled=page>=pages-1;}
let debounce;$('search').oninput=()=>{clearTimeout(debounce);debounce=setTimeout(filter,160);};$('previous').onclick=()=>{page--;render();};$('next').onclick=()=>{page++;render();};
$('download').onclick=()=>{const d=sets[selected];const quote=c=>'"'+String(c??'').replaceAll('"','""')+'"';const text=d.kind==='table'?'\uFEFF'+[d.columns,...filtered].map(row=>row.map(quote).join((d.export_name||d.file).endsWith('.tsv')?'\t':',')).join('\r\n'):content;const url=URL.createObjectURL(new Blob([text],{type:'text/plain;charset=utf-8'})),a=el('a','');a.href=url;a.download=(d.export_name||d.file).split('/').pop();a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
if(sets.length)select(0);else{$('viewer').textContent='此项目当前状态：'+report.state+'。没有登记生产交付物，请查看待处理事项。';$('search').disabled=true;$('previous').disabled=true;$('next').disabled=true;}
</script>
