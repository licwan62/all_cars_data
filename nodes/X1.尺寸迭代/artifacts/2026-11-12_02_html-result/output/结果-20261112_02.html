function filter(){if(content===null)return;const d=sets[selected];if(d.kind!=='table'){$('viewer').className='text-content';$('viewer').replaceChildren((d.export_name||'').endsWith('.md')?markdown(content):el('pre',content));$('page').textContent='文本结果';$('previous').disabled=true;$('next').disabled=true;return;}const q=$('search').value.toLocaleLowerCase().trim();filtered=q?content.filter(row=>row.some(cell=>String(cell).toLocaleLowerCase().includes(q))):content;page=0;render();}
function render(){const d=sets[selected],pages=Math.max(1,Math.ceil(filtered.length/50));page=Math.min(page,pages-1);const table=el('table',''),head=el('thead',''),tr=el('tr','');for(const col of d.columns)tr.append(el('th',col));head.append(tr);table.append(head);const body=el('tbody','');for(const row of filtered.slice(page*50,page*50+50)){const tr=el('tr','');for(let i=0;i<Math.max(row.length,d.columns.length);i++)tr.append(el('td',row[i]??''));body.append(tr);}table.append(body);$('viewer').className='table-wrap';$('viewer').replaceChildren(table);$('viewer').scrollTop=0;$('searchCount').textContent=filtered.length.toLocaleString()+' / '+content.length.toLocaleString()+' 行';$('page').textContent=(page+1)+' / '+pages+' 页';$('previous').disabled=page===0;$('next').disabled=page>=pages-1;}
let debounce;$('search').oninput=()=>{clearTimeout(debounce);debounce=setTimeout(filter,160);};$('previous').onclick=()=>{page--;render();};$('next').onclick=()=>{page++;render();};
$('download').onclick=()=>{const d=sets[selected];const quote=c=>'"'+String(c??'').replaceAll('"','""')+'"';const text=d.kind==='table'?'\uFEFF'+[d.columns,...filtered].map(row=>row.map(quote).join(',')).join('\r\n'):content;const url=URL.createObjectURL(new Blob([text],{type:'text/plain;charset=utf-8'})),a=el('a','');a.href=url;a.download=(d.export_name||d.file).split('/').pop();a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
if(sets.length)select(0);else{$('viewer').textContent='此项目当前状态：'+report.state+'。没有登记生产交付物，请查看待处理事项。';$('search').disabled=true;$('previous').disabled=true;$('next').disabled=true;}
</script>
</body></html>
