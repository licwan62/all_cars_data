<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>节点结果</title>
<style>
:root{font-family:"Segoe UI","Microsoft YaHei",sans-serif;color:#1f3039;background:#edf1f2;--ink:#132e38;--accent:#007e75;--line:#d8e1e3}
*{box-sizing:border-box}body{margin:0}header{background:var(--ink);color:white;padding:32px 4vw 28px}.eyebrow{font-size:12px;letter-spacing:3px;color:#9abcc3}h1{font-size:29px;margin:12px 0}header p{color:#bbd0d4;line-height:1.8;margin:0}.tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.tag{border:1px solid #55727b;border-radius:5px;padding:6px 10px;font-size:12px}main{padding:24px 4vw 48px;max-width:2000px;margin:auto}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}.metric{background:white;border:1px solid var(--line);padding:18px 22px;border-radius:8px}.metric strong{display:block;font-size:25px;margin-top:6px;color:var(--accent)}.muted{font-size:13px;color:#647882}.notice{border-left:4px solid #b58028;background:#fff6e5;padding:14px 20px;margin-bottom:20px;font-size:13px;line-height:1.8}.notice ul{margin:8px 0;padding-left:20px}details{background:white;border:1px solid var(--line);border-radius:8px;margin:14px 0;padding:16px}summary{cursor:pointer;font-weight:600}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.7 Consolas,monospace}.workspace{display:grid;grid-template-columns:270px minmax(0,1fr);gap:18px}aside,.panel{background:white;border:1px solid var(--line);border-radius:8px;overflow:hidden}aside{align-self:start;padding:16px 10px}aside h2{font-size:14px;padding:0 8px;margin:2px 0 14px}.file{display:block;width:100%;border:0;background:white;text-align:left;padding:11px 12px;border-radius:5px;cursor:pointer;word-break:break-word;color:#36525c;margin:3px 0}.file:hover{background:#f0f5f5}.file.active{background:#ddf0ed;color:#006f65;font-weight:600}.file small{display:block;margin-top:5px;color:#71868e;font-weight:400}.toolbar{padding:18px 20px;border-bottom:1px solid var(--line)}h2{font-size:18px;margin:0 0 10px}.controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:15px}input{border:1px solid #bacbd0;border-radius:5px;padding:9px 12px;min-width:200px;flex:1;font:inherit;font-size:13px}button.action{border:1px solid #b8cace;border-radius:5px;background:#f9fbfb;padding:8px 13px;cursor:pointer;color:var(--ink)}button:disabled{opacity:.4;cursor:default}.table-wrap{overflow:auto;max-height:65vh}table{border-collapse:separate;border-spacing:0;width:100%;font-size:12px}th{position:sticky;top:0;background:#eaf1f2;text-align:left;z-index:1;color:#36515c;font-weight:600}td,th{border-bottom:1px solid #e4eaec;padding:10px 13px;min-width:95px;max-width:450px;white-space:pre-wrap;overflow-wrap:anywhere}tbody tr:nth-child(even){background:#f7f9fa}tbody tr:hover{background:#edf7f4}.pager{padding:12px 20px;display:flex;gap:10px;align-items:center;justify-content:flex-end;border-top:1px solid var(--line)}.text-content{padding:20px;max-height:65vh;overflow:auto;margin:0}.empty{padding:45px 25px;color:#75888e;line-height:1.8}.provenance{font-size:12px;color:#637880;line-height:1.8;overflow-wrap:anywhere}.footer{font-size:12px;color:#71858e;margin-top:24px;line-height:1.8}#searchCount{font-size:12px;color:#5c747d}@media(max-width:850px){.metrics{grid-template-columns:repeat(2,1fr)}.workspace{grid-template-columns:1fr}aside{max-height:240px;overflow:auto}header{padding:25px 5vw}h1{font-size:23px}.metric{padding:14px}.table-wrap{max-height:60vh}}@media print{aside,.controls,.pager{display:none}.workspace{display:block}.table-wrap{max-height:none}.notice{break-inside:avoid}}
</style>
</head>
<body>
<header><div class="eyebrow">VEHICLE DATA / NODE RESULT</div><h1 id="title">节点结果</h1><p id="description"></p><div class="tags" id="tags"></div></header>
<main>
<section class="metrics" id="metrics"></section>
<section class="notice"><b>版本与核实范围</b><div>本页完整保存生成时的登记交付物，支持离线查看。HTML 生成成功只表示展示构建完成，不代表新增抓取、重新核实或实物适配验证。</div><ul id="warnings"></ul></section>
<details id="pendingBox"><summary>待处理事项与发布说明</summary><div id="pending"></div></details>
<div class="workspace"><aside><h2>结果目录</h2><nav id="files"></nav></aside><section class="panel">
<div class="toolbar"><h2 id="fileTitle">选择结果</h2><div class="provenance" id="source"></div><div class="controls"><input id="search" placeholder="搜索当前表全部行…" aria-label="搜索当前表全部行"><button class="action" id="download" disabled>导出当前结果</button><span id="searchCount" role="status"></span></div></div>
<div id="viewer" class="empty">正在读取离线结果…</div>
<div class="pager"><button class="action" id="previous">上一页</button><span class="muted" id="page"></span><button class="action" id="next">下一页</button></div>
</section></div>
<details><summary>版本依据与上游来源</summary><pre id="provenance"></pre></details>
<p class="footer">HTML 版本按 artifacts 批次永久保存；同一版本内嵌的数据不会随当前 output 改变。完整表格按每页 50 行显示，搜索覆盖当前表全部行。离线解压需要支持 DecompressionStream 的现代浏览器。</p>
</main>
<script id="report-data" type="application/json">{"node":{"id":"link-analysis-w","path":"nodes/D2.链接分析/nodes/W型车","kind":"node","lifecycle":"planned","parent":"link-analysis","line":"D","index":2,"layer":6,"role":"support","code_dir":"src","run":[],"tests":"tests","upstream":["sku-clustering"],"outputs":[],"public_outputs":[],"pending":["W型车链接与发货核对"],"blockers":["D1当前只交付发货评估，未提供旧W型车流程要求的聚类接口"],"naming_basis":"D2链接分析下W型车分支；待接入，未视为已打通","inputs":[{"node":"sku-clustering","file":"W型车/聚类主表.json","required":true}],"interface_files":{},"html_output":"结果.html","engine_run":[]},"state":"待接入","warnings":["D1当前只交付发货评估，未提供旧W型车流程要求的聚类接口"],"manifest":{},"sources":[],"rules":[{"file":"data/SKU修改.csv","sha256":"80b882545593d5cc69fa3d007b32e7ddb44357bfb359d8edb12a77c7887a0000"},{"file":"data/发货事实.csv","sha256":"270b7ee06bd0888d136f914d0c4a442b9960965ad732bef405c4ed7cdabcc8eb"},{"file":"data/年份命名规则.json","sha256":"822952c45129d65e8adb855bd7e059a3b8d8631e65b0563edacfd092554a14bb"}],"children":[],"datasets":[],"html_version":"20261112_02"}</script>
<script>
"use strict";
const report=JSON.parse(document.getElementById('report-data').textContent), $=id=>document.getElementById(id);
const node=report.node, sets=report.datasets, cache=new Map(); let selected=-1, content=null, filtered=[], page=0, sequence=0;
const el=(tag,text,cls)=>{const e=document.createElement(tag);e.textContent=text;if(cls)e.className=cls;return e;};
document.title=node.path.split('/').pop()+' · 节点结果';$('title').textContent=node.path.split('/').pop();
$('description').textContent=node.path+' · '+node.id;
for(const text of [report.state,'数据版本 '+(report.manifest.version||'未发布'),'HTML '+report.html_version])$('tags').append(el('span',text,'tag'));
for(const [label,value] of [['登记结果',sets.length],['表格记录',sets.reduce((n,d)=>n+(d.rows||0),0).toLocaleString()],['待处理事项',(node.pending||[]).length],['子项目',report.children.length]]){const box=el('div','','metric');box.append(el('span',label,'muted'),el('strong',String(value)));$('metrics').append(box);}
for(const text of report.warnings)$('warnings').append(el('li',text));
const pending=[...(node.pending||[]),...(node.release_notes||[]),...(node.blockers||[])];
if(report.children.length)pending.push(...report.children.map(n=>n.path+' · '+n.lifecycle));
if(!pending.length)pending.push('未登记待处理事项；这不构成数据已核实声明。');
const list=el('ul','');for(const text of pending)list.append(el('li',text));$('pending').append(list);$('pendingBox').open=!!pending.length&&sets.length===0;
$('provenance').textContent=JSON.stringify({html_version:report.html_version,data_version:report.manifest.version||null,published_at:report.manifest.published_at||null,upstream:report.manifest.upstream||[],checks:report.manifest.checks||{},rules:report.rules},null,2);
for(const [i,d] of sets.entries()){const b=el('button',d.file,'file');b.append(el('small',!d.exists?'文件缺失':d.kind==='table'?d.rows.toLocaleString()+' 行 · '+d.columns.length+' 列':'文本结果'));b.onclick=()=>select(i);$('files').append(b);}
async function unpack(d){if(cache.has(d.file))return cache.get(d.file);if(typeof DecompressionStream==='undefined')throw Error('当前浏览器不支持离线解压，请使用新版 Edge 或 Chrome。');const bytes=Uint8Array.from(atob(d.packed),c=>c.charCodeAt(0));const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));const value=JSON.parse(await new Response(stream).text());cache.set(d.file,value);return value;}
async function select(i){const ticket=++sequence;selected=i;content=null;page=0;$('search').value='';$('download').disabled=true;$('searchCount').textContent='';$('previous').disabled=true;$('next').disabled=true;$('page').textContent='';const d=sets[i];$('download').textContent=d.kind==='table'?'导出 CSV':'导出文本';[...$('files').children].forEach((b,j)=>b.classList.toggle('active',j===i));$('fileTitle').textContent=d.file;$('source').textContent=d.exists?'SHA256 '+d.sha256+' · '+(d.matches_manifest?'与数据 manifest 一致':'未获数据 manifest 核实'): '登记的交付物尚不存在';$('viewer').className='empty';$('viewer').textContent='正在解压完整结果…';$('search').disabled=d.kind!=='table';try{if(!d.exists)throw Error('尚未产出此文件，未生成替代数据。');const value=await unpack(d);if(ticket!==sequence)return;content=value;$('download').disabled=false;filter();}catch(e){if(ticket===sequence)$('viewer').textContent=e.message;}}
function markdown(text){
 const root=el('div',''),lines=text.split(/\r?\n/);let i=0;
 const cells=line=>line.trim().replace(/^\|/,'').replace(/\|$/,'').split('|').map(x=>x.trim());
 while(i<lines.length){const line=lines[i];
  if(/^#{1,6} /.test(line)){const n=line.match(/^#+/)[0].length;root.append(el('h'+Math.min(n+1,6),line.slice(n+1)));i++;continue;}
  if(line.trim().startsWith('|')&&i+1<lines.length&&/^\s*\|?[\s:|-]+\|\s*$/.test(lines[i+1])){const table=el('table',''),head=el('thead',''),tr=el('tr','');for(const c of cells(line))tr.append(el('th',c));head.append(tr);table.append(head);i+=2;const body=el('tbody','');while(i<lines.length&&lines[i].trim().startsWith('|')){const row=el('tr','');for(const c of cells(lines[i]))row.append(el('td',c));body.append(row);i++;}table.append(body);const wrap=el('div','','table-wrap');wrap.style.maxHeight='none';wrap.append(table);root.append(wrap);continue;}
  if(line.trim())root.append(el('p',line));i++;
 }return root;
}
function filter(){if(content===null)return;const d=sets[selected];if(d.kind!=='table'){$('viewer').className='text-content';$('viewer').replaceChildren((d.export_name||'').endsWith('.md')?markdown(content):el('pre',content));$('page').textContent='文本结果';$('previous').disabled=true;$('next').disabled=true;return;}const q=$('search').value.toLocaleLowerCase().trim();filtered=q?content.filter(row=>row.some(cell=>String(cell).toLocaleLowerCase().includes(q))):content;page=0;render();}
function render(){const d=sets[selected],pages=Math.max(1,Math.ceil(filtered.length/50));page=Math.min(page,pages-1);const table=el('table',''),head=el('thead',''),tr=el('tr','');for(const col of d.columns)tr.append(el('th',col));head.append(tr);table.append(head);const body=el('tbody','');for(const row of filtered.slice(page*50,page*50+50)){const tr=el('tr','');for(let i=0;i<Math.max(row.length,d.columns.length);i++)tr.append(el('td',row[i]??''));body.append(tr);}table.append(body);$('viewer').className='table-wrap';$('viewer').replaceChildren(table);$('viewer').scrollTop=0;$('searchCount').textContent=filtered.length.toLocaleString()+' / '+content.length.toLocaleString()+' 行';$('page').textContent=(page+1)+' / '+pages+' 页';$('previous').disabled=page===0;$('next').disabled=page>=pages-1;}
let debounce;$('search').oninput=()=>{clearTimeout(debounce);debounce=setTimeout(filter,160);};$('previous').onclick=()=>{page--;render();};$('next').onclick=()=>{page++;render();};
$('download').onclick=()=>{const d=sets[selected];const quote=c=>'"'+String(c??'').replaceAll('"','""')+'"';const text=d.kind==='table'?'\uFEFF'+[d.columns,...filtered].map(row=>row.map(quote).join(',')).join('\r\n'):content;const url=URL.createObjectURL(new Blob([text],{type:'text/plain;charset=utf-8'})),a=el('a','');a.href=url;a.download=(d.export_name||d.file).split('/').pop();a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
if(sets.length)select(0);else{$('viewer').textContent='此项目当前状态：'+report.state+'。没有登记生产交付物，请查看待处理事项。';$('search').disabled=true;$('previous').disabled=true;$('next').disabled=true;}
</script>
</body></html>
