# A 线产线：国别线读取 A0 output/<国别>/全量/全量表.csv，店铺线读取 A0 output/US/店铺/店铺全量_<店铺>.csv。
# 所有产线均交付有损表，分别输出到 output/<产线>/压缩尺码表[ _皮卡].csv。
# 区域：该产线行的 DIMENSION-ID 区域后缀（店铺线是 US 行，尺码为该店铺发货尺码）。
# 尺码列名：输出中压缩尺码（BACKSIZE）的列名，默认 BACKSIZE；附加尺码列：按压缩尺码从全量表回填、紧跟尺码列的列（同一尺码须唯一对应）。
# 代号区域：这些区域的产线在压缩表首列加 CODE（代号），取自 02.代码映射/output/车型编码映射.csv：
#   CODE = MAKE_CODE + MODEL_CODE + YEARCODE（YEAR 两端后两位，1964-1974 → 6474，单年 1968 → 6868），
#   与 02 的 DIMENSION-CODE 同一规则；车型须在映射中，否则运行失败。代码映射当前只维护 US。
代号区域: [US]
产线:
  US: {区域: US}
  HNT: {区域: US}
  TM: {区域: US}
  TM_拆分: {区域: US}
  EU: {区域: EU}
  RU: {区域: RU, 尺码列名: 亚马逊尺码, 附加尺码列: [OZON尺码, 发货尺码]}
