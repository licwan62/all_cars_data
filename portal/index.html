<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>车型数据流水线 · 管理入口</title>
<style>
:root{font-family:"Microsoft YaHei",Arial,sans-serif;color:#182638;background:#f1f5f8;font-size:14px}
*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}
header{background:#14243c;color:#fff;padding:18px 24px;display:flex;justify-content:space-between;align-items:center;gap:16px}
header h1{font-size:20px;margin:0 0 5px}header p{margin:0;color:#b9c9dc;font-size:12px}
.header-right{text-align:right;font-size:12px;color:#cbd9e7}.header-right strong{display:block;color:#fff;font-size:14px}
.toolbar{display:flex;gap:10px;align-items:center;padding:12px 20px;background:#fff;border-bottom:1px solid #dce4ed;flex-wrap:wrap}
.toolbar input,.toolbar select,.note input,.note select,.note textarea{border:1px solid #c8d4e1;border-radius:7px;padding:8px 10px;background:#fff;color:#14243c}
.toolbar input{min-width:220px}.toolbar button,.action{border:1px solid #b6c9db;background:#fff;color:#17476d;padding:8px 12px;border-radius:7px}
.toolbar button:hover,.action:hover{background:#e9f4fa}.layout{display:grid;grid-template-columns:minmax(0,1fr) 450px;min-height:calc(100vh - 126px)}
.main{min-width:0;padding:18px}.panel{background:#fff;border:1px solid #dce4ed;border-radius:11px;box-shadow:0 2px 10px #1e36500d}
.panel-title{display:flex;justify-content:space-between;align-items:center;padding:13px 16px;border-bottom:1px solid #e5ebf1}.panel-title h2{font-size:15px;margin:0}
.graph-wrap{overflow:auto;height:590px}.graph{display:block}.graph .edge{fill:none;stroke:#a8bbcd;stroke-width:2}.graph .edge.dashed{stroke-dasharray:5 5}.graph .edge.active{stroke:#157aa7;stroke-width:3}
.graph .lane{fill:#f6f9fc}.graph .lane.alt{fill:#eff5fa}.graph .lane-label{font-weight:700;fill:#6d8297;font-size:15px}
.graph .card{cursor:pointer}.graph .card rect{fill:#fff;stroke:#bacbd9;stroke-width:1.5;rx:9}.graph .card:hover rect,.graph .card.selected rect{stroke:#197caf;stroke-width:3}
.graph .card .title{font-size:13px;font-weight:700;fill:#14243c}.graph .card .meta{font-size:11px;fill:#5a7084}.graph .card .dot{stroke:none}
.state-latest{fill:#238160}.state-stale{fill:#d67b24}.state-error{fill:#c54350}.state-deferred{fill:#6b75b4}.state-pending{fill:#8a99a7}
.hint{color:#60758a;font-size:12px}.summary{display:flex;gap:8px;flex-wrap:wrap}.badge{border-radius:999px;padding:4px 9px;font-size:11px;background:#e9eff5;color:#304b63;white-space:nowrap}.badge.latest{background:#e0f3ea;color:#237454}.badge.error{background:#ffe7ea;color:#a23242}.badge.stale{background:#fff0dd;color:#a35e16}.badge.deferred{background:#e9eafa;color:#5f61a4}
.timeline{margin-top:16px}.timeline-body{max-height:440px;overflow:auto}.event{padding:10px 16px;border-bottom:1px solid #edf1f5}.event:last-child{border:0}.event-head{display:flex;gap:8px;align-items:center;justify-content:space-between}.event-title{font-weight:600;overflow-wrap:anywhere}.event p{margin:5px 0;color:#52677c;font-size:12px;overflow-wrap:anywhere}.event time{color:#8193a4;font-size:11px;white-space:nowrap}.event button{background:none;border:0;color:#1679aa;padding:0;font-size:12px}
.side{background:#fff;border-left:1px solid #dce4ed;overflow:auto;max-height:calc(100vh - 126px);position:sticky;top:0}.side-inner{padding:20px}.side h2{font-size:19px;margin:0 0 7px}.side h3{font-size:14px;margin:22px 0 9px;border-bottom:1px solid #e3ebf2;padding-bottom:7px}.side p{margin:7px 0;line-height:1.55}.side .small{font-size:12px;color:#63788c;overflow-wrap:anywhere}
.link-node{border:0;background:#e9f4fa;color:#17698d;border-radius:5px;padding:4px 7px;margin:3px 3px 3px 0}
.file-list{max-height:245px;overflow:auto;border:1px solid #e6edf3;border-radius:7px}.file{padding:7px 9px;border-bottom:1px solid #edf1f5;overflow-wrap:anywhere}.file:last-child{border:0}.file .file-name{font-size:12px;font-weight:600}.file .file-meta{font-size:11px;color:#718497;margin:3px 0}.file .actions{display:flex;gap:8px}.file button{background:none;border:0;padding:1px 0;color:#1679aa;font-size:11px}.file .missing{color:#bd5151}
.note{border:1px solid #d9e6ed;background:#f7fafc;border-radius:9px;padding:12px;margin-top:16px}.note label{display:block;font-size:12px;color:#52677c;margin-bottom:8px}.note input,.note select,.note textarea{width:100%;margin-top:4px}.note textarea{height:75px;resize:vertical}.note button{background:#176f9a;border:0;color:#fff;border-radius:6px;padding:8px 13px}.note button:hover{background:#0f587d}
.preview{position:fixed;inset:0;background:#0c1d30a8;display:none;align-items:center;justify-content:center;padding:24px;z-index:10}.preview.show{display:flex}.preview-box{background:#fff;border-radius:10px;width:min(100%,1000px);height:min(90vh,800px);display:flex;flex-direction:column;overflow:hidden}.preview-bar{display:flex;justify-content:space-between;padding:12px 16px;border-bottom:1px solid #dce4ed;gap:12px}.preview-bar strong{overflow-wrap:anywhere}.preview-bar button{border:0;background:none;font-size:22px}.preview pre{margin:0;padding:16px;overflow:auto;white-space:pre-wrap;word-break:break-word;font:12px/1.55 Consolas,monospace;flex:1}
.error-banner{background:#fff1ef;color:#9d3642;padding:10px 20px;display:none}.error-banner.show{display:block}
@media(max-width:1000px){.layout{display:block}.side{position:static;max-height:none;border-left:0;border-top:1px solid #dce4ed}.graph-wrap{height:500px}}
</style>
<link rel="stylesheet" href="/materials.css">
</head>
<body>
<nav class="workspace-nav"><button id="home-tab">流水线</button><button id="materials-tab">维护工作台</button><button id="storage-tab">存储与追踪</button></nav>
<section id="workspace" hidden></section>
<dialog id="material-dialog"></dialog>
<header><div><h1>车型数据流水线</h1><p>节点、资料、处理记录与网站发布 · 本机管理入口</p></div><div class="header-right"><strong id="sync">正在读取…</strong><span>每 15 秒同步</span></div></header>
<div id="error" class="error-banner"></div>
<div class="toolbar"><input id="search" placeholder="搜索节点名称或 ID" aria-label="搜索节点"><select id="line"><option value="">全部产线</option><option>U</option><option>A</option><option>B</option><option>C</option><option>D</option><option>E</option><option>F</option><option>X</option><option value="website">网站</option></select><button id="refresh">立即同步</button><span id="counts" class="summary"></span></div>
<div class="layout"><main class="main"><section class="panel"><div class="panel-title"><h2>流水线流向</h2><span class="hint">点击节点查看资料与溯源 · 虚线表示按需输入 · 细点线表示容器归属</span></div><div class="graph-wrap"><svg id="graph" class="graph" role="img" aria-label="流水线依赖图"></svg></div></section><section class="panel timeline"><div class="panel-title"><h2 id="timeline-title">最近处理记录</h2><span class="hint">运行 / 发布 / 网站批次 / 人工备注</span></div><div id="events" class="timeline-body"></div></section></main><aside class="side"><div id="detail" class="side-inner"><h2>选择一个节点</h2><p class="small">流程图中点击节点，可直接浏览维护资料、当前交付物、来源批次、上游输入及处理记录。</p></div></aside></div>
<div id="preview" class="preview" role="dialog" aria-modal="true"><div class="preview-box"><div class="preview-bar"><strong id="preview-title"></strong><button id="preview-close" aria-label="关闭">×</button></div><pre id="preview-content"></pre></div></div>
<script>
const $=id=>document.getElementById(id);
const esc=value=>String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
let overview=null, selected=null, currentDetail=null, currentEvents=[];
const stateClass=s=>({'最新':'latest','过期':'stale','错误':'error','按需待刷新':'deferred','待产出':'pending'}[s]||'pending');
let portalToken='';const portalSession=fetch('/api/session').then(r=>r.json()).then(s=>{portalToken=s.token;window.portalUploadLimit=s.upload_limit});
function showError(message){$('error').textContent=message;$('error').classList.toggle('show',!!message)}
async function api(path,options={}){const response=await fetch(path,{cache:'no-store',...options});const body=await response.json();if(!response.ok)throw Error(body.error||'请求失败');return body}
async function post(path,data){await portalSession;return api(path,{method:'POST',headers:{'Content-Type':'application/json','X-Portal-Request':'1','X-Portal-Token':portalToken},body:JSON.stringify(data)})}
function badge(text,type=''){return `<span class="badge ${type}">${esc(text)}</span>`}
function summary(){let counts={};for(const n of overview.nodes)counts[n.state]=(counts[n.state]||0)+1;$('counts').innerHTML=Object.entries(counts).map(([s,n])=>badge(`${s} ${n}`,stateClass(s))).join('')+badge(`数据节点 ${overview.nodes.length}`)+badge(`网站 NAS ${overview.site.nas}`,overview.site.nas==='failed'?'error':'')}
function svg(tag,attrs={},text){const e=document.createElementNS('http://www.w3.org/2000/svg',tag);for(const [k,v] of Object.entries(attrs))e.setAttribute(k,v);if(text!==undefined)e.textContent=text;return e}
function graph(){const root=$('graph');root.replaceChildren();if(!overview)return;const q=$('search').value.trim().toLowerCase(),line=$('line').value;
 const nodes=[...overview.nodes,{id:'website',name:'网站构建与发布',line:'website',layer:7,trigger:'自动',state:overview.site.nas==='failed'?'错误':overview.site.public==='promoted'?'最新':'待产出',version:overview.site.batch||'—',deliverables:0,upstream:overview.site.upstream.map(x=>x.node)}];
 const lanes=['U','A','B','C','D','E','F','X','website'],pos={},bands=[];let y=14;
 for(const lane of lanes){const group=nodes.filter(n=>n.line===lane),columns={};for(const n of group){(columns[n.layer]??=[]).push(n)}const max=Math.max(1,...Object.values(columns).map(v=>v.length));const height=Math.max(108,66+max*88);bands.push({lane,y,height});for(const [layer,list] of Object.entries(columns))list.forEach((n,i)=>pos[n.id]={x:155+Number(layer)*225,y:y+43+i*88});y+=height+8}
 root.setAttribute('width',1950);root.setAttribute('height',y+20);root.setAttribute('viewBox',`0 0 1950 ${y+20}`);
 bands.forEach((b,i)=>{root.append(svg('rect',{class:'lane '+(i%2?'alt':''),x:0,y:b.y,width:1950,height:b.height,rx:8}));root.append(svg('text',{class:'lane-label',x:17,y:b.y+34},b.lane==='website'?'网站':b.lane+' 线'))});
 for(const edge of overview.edges){const a=pos[edge.from],b=pos[edge.to];if(!a||!b)continue;const target=nodes.find(n=>n.id===edge.to);const x1=a.x+183,y1=a.y+28,x2=b.x,y2=b.y+28,m=(x1+x2)/2;root.append(svg('path',{class:'edge '+(edge.type==='contains'?'contains ':'')+(target?.trigger==='按需'?'dashed ':'')+(selected===edge.from||selected===edge.to?'active':''),d:`M${x1},${y1} C${m},${y1} ${m},${y2} ${x2},${y2}`}))}
 for(const n of nodes){const p=pos[n.id],match=(!q||(`${n.name} ${n.id}`).toLowerCase().includes(q))&&(!line||line===n.line);const g=svg('g',{class:'card '+(selected===n.id?'selected':''),transform:`translate(${p.x},${p.y})`,opacity:match?1:.25,tabindex:0,role:'button','aria-label':`${n.name} ${n.state}`});g.append(svg('rect',{width:183,height:58}));g.append(svg('circle',{class:'dot state-'+stateClass(n.state),cx:169,cy:13,r:5}));g.append(svg('text',{class:'title',x:11,y:22},n.name.length>13?n.name.slice(0,12)+'…':n.name));g.append(svg('text',{class:'meta',x:11,y:43},`${n.state} · ${n.version||'—'}`));g.addEventListener('click',()=>selectNode(n.id));g.addEventListener('keydown',e=>{if(e.key==='Enter')selectNode(n.id)});root.append(g)}
}
function nodeButtons(ids){return ids?.length?ids.map(id=>`<button class="link-node" data-node="${esc(id)}">${esc(overview.nodes.find(n=>n.id===id)?.name||id)}</button>`).join(''):'<span class="small">无</span>'}
function file(item){if(!item)return '';const ref=esc(item.ref),label=esc(item.name||item.path),path=esc(item.path||''),location=esc(item.location||'本地');return `<div class="file"><div class="file-name">${label}</div><div class="file-meta ${item.exists?'':'missing'}">${path} · ${location}${item.rows!=null?' · '+esc(item.rows)+' 行':''}${item.sha256?' · sha256 '+esc(item.sha256.slice(0,12)):''}</div><div class="actions"><button data-preview="${ref}" ${item.previewable?'':'disabled'}>预览</button><button data-open="${ref}" ${item.exists?'':'disabled'}>默认程序打开</button></div></div>`}
function fileList(items){return items?.length?`<div class="file-list">${items.map(file).join('')}</div>`:'<p class="small">暂无</p>'}
function renderDetail(d){currentDetail=d;let html=`<h2>${esc(d.name)}</h2>`;
 if(d.id==='website'){const s=d.site;html+=`${badge('最新批次 '+(s.batch||'—'))}${badge('构建 '+s.build,s.build==='failed'?'error':'')}${badge('本批次本地 '+s.public,s.public==='promoted'?'latest':'')}${badge('本批次 NAS '+s.nas,s.nas==='failed'?'error':'')}<p class="small">当前本地站点来源：${esc(s.current_public_batch||'未记录')}<br>最近一次 NAS 成功批次：${esc(s.last_nas_published_batch||'未记录')}</p><p class="small">${esc(s.nas_error||'')}</p><h3>固定上游输入</h3>${s.upstream.map(u=>`<p><button class="link-node" data-node="${esc(u.node)}">${esc(u.node)}</button> 版本 ${esc(u.version)}<br><span class="small">${esc(u.artifact||'')}</span></p>`).join('')||'<p class="small">未记录</p>'}<h3>构建步骤</h3>${s.steps.map(x=>`<p class="small">${esc(x.name)}：${esc(x.status)}</p>`).join('')}<h3>配置、站点与批次清单</h3>${fileList(d.files)}`}
 else{const s=d.state;html+=`${badge(s.state,stateClass(s.state))}${badge(s.trigger)}${badge('版本 '+(s.version||'—'))}<p class="small">${s.issues.map(esc).join('<br>')||'当前无追踪异常'}</p><p class="small">运行命令：${esc(d.run?.join('；')||'未登记')}</p><h3>上游 → 本节点 → 下游</h3><p>${nodeButtons(d.declared_upstream)} → <strong>${esc(d.name)}</strong> → ${nodeButtons(d.downstream)}</p><p class="small">命名依据：${esc(d.naming_basis||'旧版登记')} · ${esc(d.kind)} / ${esc(d.lifecycle)}</p><button type="button" onclick="openMaterials(selected)">维护本节点资料</button><h3>维护资料 <span class="small">${d.docs.length} 份</span></h3><input id="doc-search" placeholder="筛选资料路径" style="width:100%;padding:7px;margin-bottom:7px;border:1px solid #c8d4e1;border-radius:6px"><div id="docs-list">${fileList(d.docs)}</div><h3>当前交付物</h3>${fileList(d.outputs)}${d.outputs.map(o=>o.source?`<p class="small">${esc(o.name)} 的保存批次：${esc(o.source.path)}</p>${fileList([o.source])}`:'').join('')}<h3>输入溯源</h3><p class="small">按运行记录或发布时记录展示；未记录逐交付物关系时仅表示节点级输入。</p>${d.upstream.map(u=>`<p><button class="link-node" data-node="${esc(u.node)}">${esc(u.node)}</button> 版本 ${esc(u.version)} · ${esc(u.basis)} · ${u.files.length} 文件</p>${fileList(u.files.map(f=>f.source).filter(Boolean))}`).join('')||'<p class="small">无上游记录</p>'}<h3>发布时规则快照</h3>${fileList(d.rules.map(r=>r.file))}<h3>代码和清单</h3>${fileList(d.files)}<h3>待产出</h3><p class="small">${esc(d.pending.join('、')||'无')}</p>`}
 html+=`<h3>历史批次</h3><div class="file-list">${d.history.slice(0,80).map(h=>`<div class="file"><span class="file-name">${esc(h.name)}</span> ${badge(h.location)}<div class="actions"><button data-open="${esc(h.ref)}" ${h.location==='归档不可用'?'disabled':''}>打开批次目录</button></div></div>`).join('')||'<p class="small">暂无</p>'}</div>`;
 const fileOptions=(d.id==='website'?d.files:[...d.docs,...d.files,...d.outputs]).slice(0,500).map(f=>`<option value="${esc(f.ref)}">${esc(f.path)}</option>`).join('');
 html+=`<form id="note-form" class="note"><strong>记录一次处理</strong><label>摘要<input name="summary" required maxlength="200" placeholder="例如：核对来源后更新规则"></label><label>详情<textarea name="detail" maxlength="5000" placeholder="处理原因、结果或待办"></textarea></label><label>关联批次<select name="event_key" id="event-select"><option value="">不关联批次</option></select></label><label>关联资料<select name="file_ref"><option value="">不关联文件</option>${fileOptions}</select></label><button type="submit">保存处理记录</button></form>`;
 $('detail').innerHTML=html;
 $('note-form').addEventListener('submit',saveNote);
 const docSearch=$('doc-search');if(docSearch)docSearch.addEventListener('input',()=>{const term=docSearch.value.toLowerCase();$('docs-list').innerHTML=fileList(d.docs.filter(f=>f.path.toLowerCase().includes(term)))});
 populateEvents();
}
function populateEvents(){const select=$('event-select');if(!select)return;select.innerHTML='<option value="">不关联批次</option>'+currentEvents.filter(e=>e.type==='auto').slice(0,80).map(e=>`<option value="${esc(e.event_key)}">${esc(e.kind+' · '+e.title)}</option>`).join('')}
async function saveNote(e){e.preventDefault();const form=e.currentTarget,data=Object.fromEntries(new FormData(form));data.node_id=selected;try{await post('/api/notes',data);form.reset();await loadEvents();showError('')}catch(error){showError(error.message)}}
function renderHome(){$('detail').innerHTML=`<h2>统一管理入口</h2><p class="small">点击流程图中的节点查看维护资料、交付物、输入来源和历史批次。下方是整个流水线的权威清单与资料目录。</p><h3>系统资料</h3>${fileList(overview.files)}`}
function renderEvents(){const holder=$('events');holder.innerHTML=currentEvents.map(e=>`<div class="event"><div class="event-head"><div class="event-title">${badge(e.kind,e.type==='note'?'latest':'')} ${esc(e.title)}</div><time>${esc(e.occurred_at)}</time></div><p>${esc(e.node_id)} · ${esc(e.status)}${e.event_key&&e.type==='note'?' · 关联 '+esc(e.event_key):''}</p>${e.detail?`<p>${esc(e.detail)}</p>`:''}${e.file_ref?`<button data-preview="${esc(e.file_ref)}">查看记录</button> <button data-open="${esc(e.file_ref)}">打开文件</button>`:''}</div>`).join('')||'<div class="event">暂无记录</div>';populateEvents()}
async function loadEvents(){currentEvents=await api('/api/events'+(selected?'?node='+encodeURIComponent(selected):''));renderEvents()}
async function selectNode(id){selected=id;graph();$('timeline-title').textContent=id==='website'?'网站处理记录':(overview.nodes.find(n=>n.id===id)?.name||id)+' · 处理记录';try{const [detail,events]=await Promise.all([api('/api/node?id='+encodeURIComponent(id)),api('/api/events?node='+encodeURIComponent(id))]);currentEvents=events;renderDetail(detail);renderEvents();showError('')}catch(error){showError(error.message)}}
async function refresh(){try{overview=await api('/api/overview');summary();graph();$('sync').textContent='已同步 '+new Date(overview.synced_at).toLocaleString('zh-CN');if(selected){const form=$('note-form');const editing=form&&(form.elements.summary.value||form.elements.detail.value);if(editing||window.materialDirty||document.getElementById('material-dialog')?.open)await loadEvents();else await selectNode(selected)}else{renderHome();await loadEvents()}showError('')}catch(error){showError(error.message);$('sync').textContent='同步失败'}}
document.addEventListener('click',async e=>{const node=e.target.closest('[data-node]');if(node){selectNode(node.dataset.node);return}const preview=e.target.closest('[data-preview]');if(preview){try{const data=await api('/api/preview?ref='+encodeURIComponent(preview.dataset.preview));$('preview-title').textContent=data.path+(data.truncated?'（仅显示前 200 KB）':'');$('preview-content').textContent=data.content;$('preview').classList.add('show');showError('')}catch(error){showError(error.message)}return}const open=e.target.closest('[data-open]');if(open){try{await post('/api/open',{ref:open.dataset.open});showError('')}catch(error){showError(error.message)}}});
$('preview-close').onclick=()=>$('preview').classList.remove('show');$('preview').addEventListener('click',e=>{if(e.target===$('preview'))$('preview').classList.remove('show')});
$('refresh').onclick=refresh;$('search').addEventListener('input',graph);$('line').addEventListener('change',graph);refresh();setInterval(refresh,15000);
</script>
<script src="/materials.js"></script>
</body>
</html>
